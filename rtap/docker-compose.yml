services:
  # ============================================================================
  # RTAP Production MVP Control Plane Backend
  # ============================================================================
  rtap-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtap-server:latest
    container_name: rtap-production-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - RTAP_DATA_DIR=/app/runs
      - OPERATOR_TOKEN=${OPERATOR_TOKEN}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      - PROMPTFOO_DISABLE_TELEMETRY=1
      - PROMPTFOO_DISABLE_UPDATE=1
      - PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION=true
      - PROMPTFOO_DISABLE_SHARING=true
    volumes:
      # Persistent volume for SQLite assessment database, probe artifacts, and reports
      - rtap-runs:/app/runs
    networks:
      - rtap-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Nginx TLS Reverse Proxy for strazh.dev
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: rtap-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/strazh.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/ssl/certs:ro
      - ./deploy/private:/etc/ssl/private:ro
      - ./deploy/certbot:/var/www/certbot:ro
    depends_on:
      rtap-server:
        condition: service_healthy
    networks:
      - rtap-net

volumes:
  rtap-runs:
    name: rtap_runs_data

networks:
  rtap-net:
    name: rtap_production_network
