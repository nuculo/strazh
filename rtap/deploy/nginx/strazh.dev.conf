# ==============================================================================
# RTAP Production Reverse Proxy Configuration — strazh.dev
# ==============================================================================
# Security invariants:
# 1. Automatic HTTP to HTTPS redirection (HSTS preloaded)
# 2. Strict Origin/Edge TLS with TLS 1.2+
# 3. Request rate-limiting on sensitive assessment trigger endpoints
# 4. Strict security headers (CSP, Framing, MIME sniffing protection)
# ==============================================================================

# Rate limiting zones:
# - rtap_trigger: 5 requests per minute for triggering assessments (prevent abuse)
# - rtap_api: 60 requests per minute for general API polling
limit_req_zone $binary_remote_addr zone=rtap_trigger:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rtap_api:10m rate=60r/m;

# 1. HTTP Server — Redirection to HTTPS & ACME HTTP-01 Challenge
server {
    listen 80;
    listen [::]:80;
    server_name strazh.dev www.strazh.dev;

    # ACME challenge location for Let's Encrypt certificate issuance and renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://strazh.dev$request_uri;
    }
}

# 2. HTTPS Server — Redirect www to apex strazh.dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.strazh.dev;

    ssl_certificate /etc/ssl/certs/strazh.dev.crt;
    ssl_certificate_key /etc/ssl/private/strazh.dev.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    return 301 https://strazh.dev$request_uri;
}

# 3. HTTPS Server — Primary strazh.dev Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strazh.dev;

    # TLS Certificates (Mount Cloudflare Origin CA or Let's Encrypt certificates)
    ssl_certificate /etc/ssl/certs/strazh.dev.crt;
    ssl_certificate_key /etc/ssl/private/strazh.dev.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;" always;

    # Upstream RTAP Control Plane Server
    location /api/assessments/start {
        limit_req zone=rtap_trigger burst=2 nodelay;
        proxy_pass http://rtap-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location /api/ {
        limit_req zone=rtap_api burst=15 nodelay;
        proxy_pass http://rtap-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Static UI assets and Dashboard
    location / {
        proxy_pass http://rtap-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
